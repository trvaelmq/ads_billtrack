name: ads_billtrack
description: "智探眼 — 财务健康体检与深度分析"
publish_to: 'none'

version: 1.0.6+8

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  uuid: ^4.4.2
  crypto: ^3.0.3
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.0
  share_plus: ^10.1.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon_source.png
    - assets/app_icon.png
